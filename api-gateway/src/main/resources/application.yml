spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
            - id: patients
              uri: lb://patient-service
              predicates:
                - Path=/patients/**
            - id: doctors
              uri: lb://doctor-service
              predicates:
                - Path=/doctors/**
            - id: appointments
              uri: lb://appointment-service
              predicates:
                - Path=/appointments/**
            - id: records
              uri: lb://medical-record-service
              predicates:
                - Path=/records/**
            - id: invoices
              uri: lb://billing-service
              predicates:
                - Path=/invoices/**
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
