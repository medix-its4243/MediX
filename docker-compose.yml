services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: local-postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "8761:8761"
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET_required_minimum_32_characters}
    depends_on:
      eureka-server:
        condition: service_healthy
    ports:
      - "8080:8080"
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_HOST: postgres
      CONFIG_SERVER_URL: http://config-server:8888
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET_required_minimum_32_characters}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
  patient-service:
    build:
      context: .
      dockerfile: patient-service/Dockerfile
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
  doctor-service:
    build:
      context: .
      dockerfile: doctor-service/Dockerfile
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
  appointment-service:
    build:
      context: .
      dockerfile: appointment-service/Dockerfile
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
  medical-record-service:
    build:
      context: .
      dockerfile: medical-record-service/Dockerfile
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
  billing-service:
    build:
      context: .
      dockerfile: billing-service/Dockerfile
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_HOST: postgres
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
volumes:
  postgres-data:
