spring:
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  application:
    name: auth-service
server:
  port: ${PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
